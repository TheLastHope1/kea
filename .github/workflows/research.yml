# Backtests on GitHub's runners, where Yahoo's long, dividend-adjusted history is
# usually reachable. Only results are published (job summary + artifact), never
# the raw vendor data. Informational: data-source hiccups never block a PR.
name: Research backtests

on:
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "config/**", ".github/workflows/research.yml"]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install .
      - name: Data sources
        run: kea -v data
      - name: ETF portfolio vs benchmarks
        run: kea compare --sizes --json reports/etf.json --markdown reports/etf.md --html reports/etf.html
      - name: Crypto (research only)
        run: kea -c config/crypto.toml compare --json reports/crypto.json --markdown reports/crypto.md
      - name: Job summary
        if: always()
        run: cat reports/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kea-research
          path: reports/
          if-no-files-found: ignore
