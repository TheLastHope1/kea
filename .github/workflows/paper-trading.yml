# Runs Kea's autonomous decision cycle once per US trading day and commits the
# paper account, journal and equity track record to the `paper-ledger` branch.
# The branch's commit history is a timestamped, tamper-evident track record.
#
# Scheduled workflows only run from the default branch, so this starts once
# merged. A circuit-breaker halt or an error fails the run, and GitHub emails
# the repository owner.
name: Paper trading

on:
  schedule:
    - cron: "15 22 * * 1-5" # 22:15 UTC, after the US close in both EDT and EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install .
      - name: Restore the market-data cache
        uses: actions/cache@v4
        with:
          path: .kea/cache
          key: kea-data-${{ github.run_id }}
          restore-keys: kea-data-
      - name: Check out the ledger branch
        run: |
          if git ls-remote --exit-code --heads origin paper-ledger > /dev/null; then
            git fetch --depth=1 origin paper-ledger
            git worktree add ledger FETCH_HEAD
            git -C ledger switch -c paper-ledger
          else
            git worktree add --detach ledger
            git -C ledger switch --orphan paper-ledger
          fi
      - name: Run one decision cycle
        id: run
        run: |
          set +e
          kea -v -c config/default.toml -s broker.state_dir=ledger/state run | tee ledger/last-run.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Build the dashboard
        if: always()
        run: kea -c config/default.toml -s broker.state_dir=ledger/state report --no-backtest --html ledger/index.html
      - name: Commit the ledger
        if: always()
        run: |
          cd ledger
          git config user.name "kea-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "paper ledger: $(date -u +%Y-%m-%d) ($(head -1 last-run.txt | cut -c1-60))"
            git push origin HEAD:paper-ledger
          fi
      - name: Fail loudly on a halt or error
        if: steps.run.outputs.exit != '0'
        run: |
          echo "::error::kea run exited with ${{ steps.run.outputs.exit }}; see ledger/last-run.txt"
          exit 1
