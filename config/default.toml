# Kea default configuration: paper trading a diversified ETF portfolio.
#
# Every value below is also the built-in default, written out so you can see
# and change it. Parameters come from the published literature, NOT from tuning
# on backtests. If you change them because a backtest looked better, count that
# as a trial (`kea compare --trials N`) so the deflated Sharpe ratio stays honest.

[universe]
# US-listed ETFs covering stocks, bonds, real estate, gold and commodities.
symbols = ["SPY", "QQQ", "IWM", "EFA", "EEM", "VNQ", "TLT", "IEF", "LQD", "GLD", "DBC"]
cash_symbol = "BIL"     # 1-3 month T-bill ETF: where unallocated money waits
benchmark = "SPY"
asset_class = "equity"

[data]
provider = "auto"       # Yahoo first, Nasdaq as a fallback
start = "2005-01-01"
cache_dir = ".kea/cache"
max_cache_age_hours = 12
allow_price_only = false

[strategy]
name = "ensemble"
members = ["trend", "momentum", "ml"]
rebalance = "monthly"   # decide on the first session of each month

[strategy.trend]        # time-series momentum over 1, 3, 6 and 12 months
lookbacks = [21, 63, 126, 252]
vol_lookback = 63

[strategy.momentum]     # 12-1 month relative momentum, top 3, must beat cash
lookback = 252
skip = 21
top_k = 3

[strategy.ml]           # walk-forward gradient boosting, refit quarterly
model = "gbm"
horizon = 21
min_train_days = 756
sample_every = 5
conviction_scale = 0.10
vol_lookback = 63
random_state = 7

[risk]
target_vol = 0.10       # cut exposure when predicted volatility exceeds 10% a year
max_gross = 1.0         # never leveraged
max_weight = 0.35       # no single ETF above 35%
cov_lookback = 126
shrinkage = 0.2
halt_drawdown = 0.25    # circuit breaker: stop and wait for a human...
halt_daily_loss = 0.06  # ...or after a 6% day
max_price_jump = 0.35   # treat bigger one-day moves as bad data

[execution]
fees = "tiger_nz"       # Tiger Brokers NZ schedule for US ETFs (USD 2 per order)
free_orders_per_month = 0
slippage_bps = 5.0
whole_shares = true
drift_band = 0.02       # leave positions alone unless they are 2% of equity off target
min_trade_value = 250.0
cash_buffer = 0.01

[broker]
kind = "paper"          # local simulated account; "tiger" uses the Tiger OpenAPI
initial_cash = 10000.0
state_dir = ".kea/state"
allow_live = false
